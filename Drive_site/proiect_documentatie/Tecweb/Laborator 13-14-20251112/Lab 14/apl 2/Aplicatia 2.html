<html>
<head>
<script>
function arataSugestia(str) {
  if (str.length == 0) {
    document.getElementById("txtHint").innerHTML = "";
    return;
  } else {
    var xmlhttp = new XMLHttpRequest();
    xmlhttp.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        document.getElementById("txtHint").innerHTML = this.responseText;
      }
    };
    xmlhttp.open("GET", "getSugestie.php?q=" + str, true);
    xmlhttp.send();
  }
}
</script>
</head>
<body>

<p><strong>Tasta&#539;i un nume &icirc;n caseta de mai jos</strong></p>
<form action="">
 
  <p>Numele: 
    <label>
    <input type="text" name="nume" id="nume"onKeyUp="arataSugestia(this.value)">
    </label>
  </p>
  <!--<div id="txtHint"></div><br>-->
 <!-- sau-->
   <span id="txtHint"></span>
  <p>
   
  </p>
</form>
<!--<p>Suggestions: <span id="txtHint"></span></p>-->
</body>
</html>
