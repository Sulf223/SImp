
<!DOCTYPE html>


<html>
   <head>
     <title>Aplicatie text Canvas</title>

      <style> 
         body {
            background: #dddddd;
         }

         #canvas {
            margin: 10px;
            padding: 10px;
            background: #ffffff;
            border: thin inset #aaaaaa;
         }
      </style>
   </head>

  <body>
 

    <canvas id='canvas' width='600' height='300'>
     
    </canvas>

    <script >
var canvas = document.getElementById('canvas'),
    context = canvas.getContext('2d');
   
context.font = '38pt Arial';
context.fillStyle = 'cornflowerblue';
context.strokeStyle = 'blue';

context.fillText("Exemplu aplicatie Canvas", canvas.width/2 - 300,
                                 canvas.height/2 + 15);

context.strokeText("Exemplu aplicatie Canvas", canvas.width/2 - 300,
                                   canvas.height/2 + 15 );
</script>
  </body>
</html>
