<HTML>
<HEAD>
<TITLE>BANNER</TITLE>
<SCRIPT TYPE="TEXT/JAVASCRIPT">
Lg=110;
Viteza=2;
Poz=Lg;
Mesaj="Text care deruleaza   ";
Dir=2;
Lg-=Mesaj.length-1;
function Balans()
{Dir==2 ? Poz-=Viteza:Poz+=Viteza;
if (Poz<1) {Dir=1;Poz=1;}
if (Poz>Lg) {Dir=2;Poz=Lg;}
Sp=" "
for (i=1; i<Poz;i++) Sp+=" ";
document.F.Text.value=Sp+Mesaj;
setTimeout('Balans();',100);
}
</SCRIPT>
</HEAD>

<BODY ONLOAD="setTimeout('Balans();',100);">
<CENTER> 
<FORM NAME="F">
<INPUT SIZE=80 NAME="Text" VALUE="                      ">
</FORM>
</CENTER>
</BODY>
</HTML>
