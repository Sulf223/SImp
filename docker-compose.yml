services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_VERSION=2.0
    container_name: offbyone_academy_web
    hostname: offbyone-academy-web
    image: offbyone-academy:2.0-php8.2
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root123
      DB_NAME: dbsortari
      
      # Application
      APP_ENV: production
      APP_DEBUG: "false"
      
      # AI/Profesor
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      
      # Server
      SITE_URL: ${SITE_URL:-http://localhost:8082}
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data

      # Email
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-none}
      MAIL_FROM: ${MAIL_FROM:-noreply@offbyone-academy.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OffByOne Academy}
      
    ports:
      - "8082:80"
    
    volumes:
      # Application code (read-only for production)
      - ./site_g:/var/www/html:ro
      # Relocated .env (mapping to legacy location inside container for ease, or root)
      - ./.env:/var/www/.env:ro
      # Writable directories
      - ./site_g/uploads:/var/www/html/uploads:rw
      - ./site_g/logs:/var/www/html/logs:rw
    
    networks:
      - offbyone_academy_network
    
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php?page=bun_venit", "-H", "Host: localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    labels:
      - "com.offbyoneacademy.description=OffByOne Academy Web Application"
      - "com.offbyoneacademy.version=2.0"

  db:
    image: mysql:8.0.37
    container_name: offbyone_academy_db
    hostname: offbyone-academy-mysql
    
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --max_allowed_packet=256M
    
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dbsortari
      MYSQL_ROOT_HOST: '%'
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    
    ports:
      - "3308:3306"
    
    volumes:
      # Database persistence
      - db_data:/var/lib/mysql
      # SQL initialization scripts
      - ./site_g/dbsortari.sql:/docker-entrypoint-initdb.d/01_dbsortari.sql:ro
      - ./site_g/database/upgrade_dashboard_progress.sql:/docker-entrypoint-initdb.d/02_upgrade_dashboard_progress.sql:ro
      - ./site_g/database/upgrade_recursivitate_backtracking.sql:/docker-entrypoint-initdb.d/03_upgrade_recursivitate.sql:ro
      - ./site_g/database/upgrade_profile_streak.sql:/docker-entrypoint-initdb.d/04_upgrade_profile_streak.sql:ro
      - ./site_g/database/upgrade_rate_limit.sql:/docker-entrypoint-initdb.d/05_upgrade_rate_limit.sql:ro
      - ./site_g/database/upgrade_learning_paths.sql:/docker-entrypoint-initdb.d/06_upgrade_learning_paths.sql:ro
      - ./site_g/database/upgrade_password_reset.sql:/docker-entrypoint-initdb.d/07_upgrade_password_reset.sql:ro
      - ./site_g/database/upgrade_admin_audit_log.sql:/docker-entrypoint-initdb.d/08_upgrade_admin_audit_log.sql:ro
      - ./site_g/database/upgrade_achievements.sql:/docker-entrypoint-initdb.d/09_upgrade_achievements.sql:ro
      - ./migrations/20260505_add_doc_link_to_grile_cpp.sql:/docker-entrypoint-initdb.d/10_add_doc_link_to_grile_cpp.sql:ro
    
    networks:
      - offbyone_academy_network
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    labels:
      - "com.offbyoneacademy.description=OffByOne Academy MySQL Database"
      - "com.offbyoneacademy.version=8.0"

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: offbyone_academy_phpmyadmin
    hostname: offbyone-academy-pma
    
    depends_on:
      db:
        condition: service_healthy
    
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123
      PMA_DB: dbsortari
      UPLOAD_LIMIT: 64M
      MAX_EXECUTION_TIME: 600
      MEMORY_LIMIT: 256M
    
    ports:
      - "8081:80"
    
    networks:
      - offbyone_academy_network
    
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/", "-H", "Host: localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.offbyoneacademy.description=phpMyAdmin Database Administration"
      - "com.offbyoneacademy.version=5"

  mailpit:
    image: axllent/mailpit:latest
    container_name: offbyone_academy_mailpit
    hostname: offbyone-academy-mailpit
    ports:
      - "8025:8025"
    networks:
      - offbyone_academy_network
    restart: unless-stopped
    labels:
      - "com.offbyoneacademy.description=Local Email Inbox"
      - "com.offbyoneacademy.version=latest"

networks:
  offbyone_academy_network:
    driver: bridge

volumes:
  db_data:
    driver: local

