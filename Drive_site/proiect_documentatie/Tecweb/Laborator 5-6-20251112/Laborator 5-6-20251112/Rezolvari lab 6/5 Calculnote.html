<html >
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<script type="text/javascript">
function Calcul()
{
 if ((form1.nl.value>=5)&&(form1.ne.value>=5))
  {
   form1.nf.value=eval((2*eval(form1.ne.value)+eval(form1.nl.value))/3);
   form1.rez.value="Promovat";
  }
 else 
   {
   form1.nf.value=4;
   form1.rez.value="Nepromovat";
  }
}
function Reset()
{
 form1.nl.value="";
 form1.ne.value="";
 form1.nf.value="";
 form1.rez.value="";
 }

</script>

</head>

<body>
<form id="form1" name="form1" method="post" action="">
  <p>Nota laborator
    <input type="text" name="nl" id="nl" />
  </p>
  <p>Nota examen 
    <label>
    <input type="text" name="ne" id="ne" />
    </label>
</p>
  <p>Nota finala 
    <label>
    <input type="text" name="nf" id="nf" />
    </label>
  </p>
  <p>Rezultat 
    <label>
    <input type="text" name="rez" id="rez" />
    </label>
  </p>
  <p>
    <label>
    <input type="button" name="button" id="button" onClick="Calcul()" value="Calcul" />
    </label>
    <label>
    <input type="button" name="button2" id="button2" onClick="Reset()" value="Reset" />
    </label>
  </p>
</form>
</body>
</html>
