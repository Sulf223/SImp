  <script language="JavaScript" type="text/JavaScript">
function  CampGol(sir)
{
if (sir.length==0)
return true;
else return false;
}

function VerificareN()
{
var Sir=form1.Nume.value;
var Corect=true;
for(i=0;i< Sir.length;i++)
  if (((Sir.charAt(i)<'A') || (Sir.charAt(i)>'Z')) && ((Sir.charAt(i)<'a') || (Sir.charAt(i)>'z')))
    Corect=false;
	
return Corect;
}
function VerificareNume()
{ 
 
 if (VerificareN())
  alert("Nume corect");
else
  alert("Nume gresit");
}

function VerificareDataN()
{ 

 if (VerificareDataIntrodusa())
  alert("Data nasterii corecta");
else
  alert("Data nasterii incorecta");
}

function VerificareDataIntrodusa()
{ 
var corect=true;
var Sir= form1.Dn.value;
var ziua='';
ziua=ziua + Sir.charAt(0) + Sir.charAt(1);
if(parseInt(ziua)<1||parseInt(ziua)>31)corect=false;

var luna='';
luna=luna + Sir.charAt(3) + Sir.charAt(4);
if(parseInt(luna)<1||parseInt(luna)>12)corect=false;

var an='';
var dataCurenta = new Date();
var anulCurent = dataCurenta.getFullYear();
an=an +  Sir.charAt(6) + Sir.charAt(7)+ Sir.charAt(8) + Sir.charAt(9);  
if(parseInt(an)<0||parseInt(an)>anulCurent)corect=false;

for(i=0;i< Sir.length;i++)
if((Sir.charAt(i)>='A' && Sir.charAt(i)<='Z') || (Sir.charAt(i)>='a' && Sir.charAt(i)<='z')) corect=false;

return corect;
}

function CalculV()
{var Sir=form1.Nume.value;
if(CampGol(Sir)) alert("Nu ati introdus niciun nume!");
if (!VerificareDataIntrodusa())alert("Nu ati introdus o data corecta!");
else{
var Azi = new Date();  //obtine data curenta a sistemului de operare
var LunaA = Azi.getMonth() + 1; //obtine luna curenta: 0=ianuarie, etc
var ZiA = Azi.getDate(); //obtine ziua curenta
var AnA = Azi.getFullYear();// obtine anul curent
var SAnN='' ;  
var SLunaN='' ;  
var SZiN ='' ;
var Sir= form1.Dn.value;
SZiN=SZiN + Sir.charAt(0) + Sir.charAt(1);
SLunaN=SLunaN + Sir.charAt(3) + Sir.charAt(4);  
SAnN=SAnN + Sir.charAt(6) + Sir.charAt(7)+ Sir.charAt(8) + Sir.charAt(9);  
AnN = AnA - parseInt(SAnN) ;
form1.varsta.value = AnN;}
}
</script>
