<script type="text/javascript">
<!--
// Iintroduceti limita de timp pana la redirect, care este de forma "minute:secunde" si apare in status.
// Minutele sunt de la 0 la inifinit. Secundele trebuie sa fie un numar cuprins intre 0 si 59
var limit="0:10"
if (document.images) {
  var parselimit=limit.split(":")
  parselimit=parselimit[0]*60+parselimit[1]*1
}
function stimer() {
  if (!document.images)
return
  if (parselimit==1)
    window.location="curs1.html"    // Aici schimbati adresa paginii care va fi deschisa la redirect
  else { 
    parselimit-=1
    curmin=Math.floor(parselimit/60)
    cursec=parselimit%60
  if (curmin!=0)
    curtime=curmin+" minute si "+cursec+" secunde"
  else
    curtime=cursec+" secunde"
    window.status="Redirect in "+curtime
    setTimeout("stimer()",1000)
  }
}
//-->
</script> 
</head>

<body onload="stimer();">
