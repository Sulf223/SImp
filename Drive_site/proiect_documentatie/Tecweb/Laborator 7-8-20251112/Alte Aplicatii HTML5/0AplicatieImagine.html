
<!DOCTYPE html>
<html>
   <head>
     <title>Desenarea unei imagini intr-o componenta de tip CANVAS</title>

      <style> 
         body {
		 
            background: rgba(100, 145, 250, 0.3); //rgba este o extensie a rgb-ului in care se poate specifica si opacitatea obiectului
         }

         #canvas {
            margin-left: 20px;
            margin-right: 0;
            margin-top: 10px;
            margin-bottom: 20px;
            border: thin solid #aaaaaa;
            cursor: crosshair;
            padding: 0;
         }
      </style>
   </head>

  <body>
     <canvas id='canvas' width='800' height='520'>
        
     </canvas>
     <script >
     
var canvas = document.getElementById('canvas'),
    context = canvas.getContext('2d'),
    image = new Image();

image.src = 'P1.png';
image.onload =function() {
   context.drawImage(image, 0, 0);
};
     </script>
  </body>
</html>
