<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>Untitled Document</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
</head>

<body>
<script language="JavaScript" type="text/JavaScript">
function  CampGol(Sir)
{
if (Sir.length==0)
 return  true;
 else
  return false;
}


function VerificNume()
{ 
var Sir=form1.Nume.value;
 if (CampGol(Sir)==true)
  alert("Nume necompletat");
  for(i=0;i<Sir.length;i++)if(Sir.charAt(i)<"A"||Sir.charAt(i)>"Z") alert("Numele contine litere");
}

function VerificUser()
{ 
var Sir=form1.User.value;
 if (CampGol(Sir)==true)
  alert("Nume de user necompletat");
if( !(((Sir.charAt(0)>='A') && (Sir.charAt(0)<='Z')) || ((Sir.charAt(0)>='a') && (Sir.charAt(0)<='z'))))
 alert("Prima trebuie sa fie litera"); 
}

function VerificParola()
{ 
var Sir=form1.Parola.value;
 if (CampGol(Sir)==true)
  alert("Parola necompletata");
  else
  { if (Sir.length <6)
     alert("Parola prea scurta");
	 
  }
}
function VerificStudii()
{

if ((form1.RadioGroup1[0].checked==false) && (form1.RadioGroup1[1].checked==false) && (form1.RadioGroup1[2].checked==false))
 alert ("Nu ati ales studiile")
}

function VerificareCampuri()
{
 VerificNume();
 VerificUser();
 VerificParola();
 VerificStudii();
 }
</script>
<form action="" method="post" enctype="multipart/form-data" name="form1">
  <p>Numele dumneavoastra 
    <input name="Nume" type="text" id="Nume">
    Nume cont 
    <input name="User" type="text" id="User">
    Parola 
    <input name="Parola" type="password" id="Parola">
  </p>
  <p>Opiniile dumneavoastra 
    <textarea name="textarea" rows="3" wrap="VIRTUAL"></textarea>
  </p>
  <p>Casatorit 
    <input type="checkbox" name="checkbox" value="checkbox">
  </p>
  <p>Studii : 
    <label> </label>
  </p>
  <p> 
    <label> 
    <input type="radio" name="RadioGroup1" value="El">
    Elementare</label>
    <br>
    <label> 
    <input type="radio" name="RadioGroup1" value="Med">
    Medii</label>
    <br>
    <label> 
    <input type="radio" name="RadioGroup1" value="Sup">
    Superioare</label>
  </p>
  <p>Cursul pe care doriti sa-l urmati: 
    <select name="select">
      <option value="PI" selected>Programare Internet</option>
      <option value="BD">Baze de date</option>
      <option value="PV">Programare vizuala</option>
    </select>
  </p>
  <p>Adaugati fisierul cu CV:</p>
  <p> 
    <input type="file" name="file">
  </p>
  <p> 
    <input type="button" name="Button" value="Trimitere date" onclick ="VerificareCampuri();">
    <input type="reset" name="Submit2" value="Reintroducere valori">
  </p>
  <p>&nbsp;</p>
</form>
</body>
</html>
