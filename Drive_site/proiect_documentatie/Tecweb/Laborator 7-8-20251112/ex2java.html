<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
<script type="text/javascript">
function Validare()
{ 
 var ok=true;
  nume=form1.nume.value;
if (nume.length==0)
{ok=false;
 alert("Nu ai completat numele");
}

suma=form1.suma.value;
if (suma.length==0)
{ok=false;
 alert("Nu ai completat suma imprumutata");
 }
 
if ((form1.RadioGroup1[0].checked==false) && (form1.RadioGroup1[1].checked==false) && (form1.RadioGroup1[2].checked==false))
{ok=false;
 alert ("Nu ati ales tipul de credit"); 
}
 return ok;
}

function Calcul()
{
 if(Validare())
 {
 nrRate=parseInt(form1.nr.value);
 if (nrRate>0)
    form1.rata.value= eval(form1.suma.value) / nrRate;
 else
 alert ("Trebuie sa ai cel putin o rata ");
 }
}
  
</script>


</head>

<body>
<form id="form1" name="form1" method="post" action="">
  <p>Numele 
    <label>
    <input type="text" name="nume" id="nume" />
    </label>
  </p>
  <p>Tip imprumut : </p>
  <table width="200">
    <tr>
      <td><label>
        <input type="radio" name="RadioGroup1" value="5" id="RadioGroup1_0" />
        Credit auto</label></td>
    </tr>
    <tr>
      <td><label>
        <input type="radio" name="RadioGroup1" value="6" id="RadioGroup1_1" />
        Cridit ipotecar</label></td>
    </tr>
    <tr>
      <td><label>
        <input type="radio" name="RadioGroup1" value="10" id="RadioGroup1_2" />
        Credit nevoi personale</label></td>
    </tr>
  </table>
  <p>Suma imprumutata 
    <label>
    <input type="text" name="suma" id="suma" />
    </label>
  </p>
  <p>Nr de rate in luni 
    <label>
    <input type="text" name="nr" id="nr" />
    </label>
  </p>
  <p>Rata calculata 
    <label>
    <input type="text" name="rata" id="rata" />
    </label>
  </p>
  <p>
    <label>
    <input type="button" name="button" id="button" value="CalculRata"  onclick="Calcul()"/>
    </label>
  </p>
  <p>&nbsp;</p>
</form>
</body>
</html>
