<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>

<script type="text/javascript">
function Verificare()
{ var ok=true;
  var s= form1.sal.value;
  if(s=="")
  {
    alert("COmpleteaza sal ");
	ok=false;
  }
  else
     if(!parseInt(s))
	  { alert("Salariul este un numar");
	    ok=false;
		}
return ok;	 
}

function CalculSal()
{
 var s= form1.sal.value;
 if(Verificare())
  {
   form1.impozit.value = 0.10 *s;
   if(eval(s)>10000)
      form1.sitfin.value="Esti bogat ";
	else
	   form1.sitfin.value="Esti sarac ...mai munceste ";
  }
}
</script>

</head>

<body>
<form id="form1" name="form1" method="post" action="">
  <p>Salariul 
    <label>
    <input type="text" name="sal" id="sal" />
    </label>
  </p>
  <p>Impozit 
    <label>
    <input type="text" name="impozit" id="impozit" />
    </label>
  </p>
  <p>Situatie financiara
    <label>
    <input type="text" name="sitfin" id="sitfin" />
    </label>
  </p>
  <p>
    <label>
    <input type="button" name="button" id="button" value="Calcul" onclick="CalculSal()" />
    </label>
    <label>
    <input type="reset" name="button2" id="button2" value="Reset" />
    </label>
  </p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</form>
</body>
</html>
