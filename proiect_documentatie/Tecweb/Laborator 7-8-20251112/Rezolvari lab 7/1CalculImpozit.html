<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>

<script type="text/javascript">

function verificareSalar()
{var corect=true;
 var sal=form1.salar.value;
 if(sal=="") {alert("Trebuie introdus un salar pentru a determina impozitul ");
 				corect=false;
				}
else if(!parseInt(sal)) {alert("Salariul este o valoare numerica, nu altceva!");
					corect=false;
					}
else if(sal<0){
			alert("Un salar nu poate fi negativ ");
				corect=false;
				}
return corect;
}

function calcul()
{
var sal=form1.salar.value;
if(verificareSalar()){ 
form1.impozit.value=sal*0.16;
	if(eval(sal)>10000) form1.situatie.value="Esti bogat";
		else form1.situatie.value="Mai trebuie sa muncesti";
					}
}

</script>
</head>

<body>
<h1 align="center">Formular de calcul impozit in functie de salar</h1>
<hr />
<form id="form1" name="form1" method="post" action="">
  <div align="center">
    <table width="200" border="0" align="left">
      <tr align="left">
        <td><div align="left">Salar</div></td>
        <td><div align="left"></div>
            <label>
            <input type="text" name="salar" id="salar" />
          </label></td>
      </tr>
      <tr align="left">
        <td><div align="left">Impozit</div></td>
        <td><div align="left">
          <label>
            <input type="text" name="impozit" id="impozit" />
            </label>
        </div></td>
      </tr>
      <tr align="left">
        <td><div align="left">Situatie financiara</div></td>
        <td><div align="left">
          <label>
            <input type="text" name="situatie" id="situatie" />
            </label>
        </div></td>
      </tr>
      <tr align="left">
        <td><div align="left">
          <label></label>
          <input type="button" name="Calcul" id="Calcul" value="Calcul"  onclick="calcul()"/>
        </div></td>
        <td><div align="left">
          <label>
            <input type="reset" name="Resetare" id="Resetare" value="Resetare informatii" />
            </label>
        </div></td>
      </tr>
    </table>
    <h1 align="left">&nbsp;</h1>
    <p align="left">&nbsp;</p>
    <p align="left">&nbsp;</p>
    <p align="left">&nbsp;</p>
    <p>&nbsp;</p>
  </div>
</form>


</body>
</html>
